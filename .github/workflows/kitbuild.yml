
name: Build KittyGens 26.3

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: KittyGens-26.3-Project/KittyGens-26.3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build plugin
        shell: bash
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew build
          else
            gradle build
          fi

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: KittyGens-26.3
          path: KittyGens-26.3-Project/KittyGens-26.3/build/libs/*.jar
          if-no-files-found: error
